kind = "web"
previewPath = "/"
title = "Infofin Solutions"
version = "1.0.0"
id = "artifacts/infofin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25824

[services.development]
run = "pnpm --filter @workspace/infofin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/infofin", "run", "build" ]
publicDir = "artifacts/infofin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25824"
BASE_PATH = "/"
